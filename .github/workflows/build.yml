name: Build DiskTool.exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller "pywebview==6.2.1"

      - name: Get wimlib (Windows imaging tool, LGPL) into bin\wimlib
        shell: pwsh
        run: |
          $v = "1.14.5"
          Invoke-WebRequest "https://wimlib.net/downloads/wimlib-$v-windows-x86_64-bin.zip" -OutFile wimlib.zip
          Expand-Archive wimlib.zip -DestinationPath wl -Force
          New-Item -ItemType Directory -Force bin\wimlib | Out-Null
          Get-ChildItem wl -Recurse -Include *.exe,*.dll,COPYING*,README* | Copy-Item -Destination bin\wimlib
          & bin\wimlib\wimlib-imagex.exe --version
          if ($LASTEXITCODE -ne 0) { throw "wimlib not working" }
          & bin\wimlib\wimlib-imagex.exe capture core test.esd "test" --solid
          if ($LASTEXITCODE -ne 0) { throw "wimlib ESD capture failed" }
          & bin\wimlib\wimlib-imagex.exe info test.esd
          Remove-Item test.esd

      - name: Smoke test on real Windows (disks, license, battery, startup)
        run: >
          python -c "import time;from core import winops,sysinfo,startup,health,deploy,settings,capture;
          t=time.time();d=winops.list_disks();print('DISKS',round(time.time()-t,1),'s',d);
          assert d, 'no disks read';
          print('LICENSE',sysinfo.license_info());print('BATTERY',sysinfo.battery());
          print('STARTUP',len(startup.list_items()));print('SMART',health.smart_details());
          print('MEMTEST',winops.memtest_results());print('SYSPREP',deploy._sysprep_exe());print('LETTERS',deploy._free_letters(2));print('SAVEIMG',callable(winops.save_image));print('WINRE',capture._winre_path(print));print('SDI',capture._boot_sdi());print('UEFI',capture._is_uefi());print('BITLOCKER',capture._bitlocker_on());print('SYSPREPDIR',capture._sysprep_dir())"

      - name: Speed test - shared PowerShell vs new PowerShell each time
        run: >
          python -c "import time,subprocess;from core import system,winops;
          t=time.time();[subprocess.run(system.PS+['Get-Date'],capture_output=True) for _ in range(5)];print('5 x new powershell',round(time.time()-t,2),'s');
          system.warm_up();t=time.time();[system.ps_text('Get-Date') for _ in range(5)];print('5 x shared powershell',round(time.time()-t,2),'s');
          t=time.time();d=winops.list_disks(0);print('disk list',round(time.time()-t,2),'s');
          [print(x['Number'],x['FriendlyName'],x['Bus'],'ext=',x['IsExternal'],'unalloc=',x['Unallocated'],'vols=',len(x['Volumes'] or [])) for x in d];
          assert d and 'Bus' in d[0] and 'Volumes' in d[0]"

      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --clean --onedir --windowed --uac-admin
          --name DiskTool --icon DiskTool.ico
          --add-data "web;web" --add-data "redist;redist"
          app.py

      - name: Make the release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release\DiskTool | Out-Null
          Copy-Item dist\DiskTool\* release\DiskTool\ -Recurse
          Copy-Item bin release\DiskTool\bin -Recurse
          Compress-Archive -Path release\DiskTool -DestinationPath DiskTool.zip -Force

      - uses: actions/upload-artifact@v5
        with:
          name: DiskTool
          path: release/DiskTool

      - name: Publish as the "latest" release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag
          if ($LASTEXITCODE -ne 0) { Write-Host "No old release - first build." }
          gh release create latest DiskTool.zip --title "Disk Tool (latest build)" --notes "Download DiskTool.zip, extract, double-click DiskTool.exe."
