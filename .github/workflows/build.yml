name: Build DiskTool.exe

on:
  push:
    branches: [main, "phase-*/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller "pywebview==6.2.1"

      - name: Get wimlib (Windows imaging tool, LGPL) into bin\wimlib
        shell: pwsh
        run: |
          $v = "1.14.5"
          Invoke-WebRequest "https://wimlib.net/downloads/wimlib-$v-windows-x86_64-bin.zip" -OutFile wimlib.zip
          Expand-Archive wimlib.zip -DestinationPath wl -Force
          New-Item -ItemType Directory -Force bin\wimlib | Out-Null
          Get-ChildItem wl -Recurse -Include *.exe,*.dll,COPYING*,README* | Copy-Item -Destination bin\wimlib
          & bin\wimlib\wimlib-imagex.exe --version
          if ($LASTEXITCODE -ne 0) { throw "wimlib not working" }
          & bin\wimlib\wimlib-imagex.exe capture core test.esd "test" --solid
          if ($LASTEXITCODE -ne 0) { throw "wimlib ESD capture failed" }
          & bin\wimlib\wimlib-imagex.exe info test.esd
          Remove-Item test.esd

      - name: Safety tests (backend guard for destructive operations)
        run: python -I tests/test_guard.py .

      - name: WinPE tests (disk layout parser, edition parser, WinPE guard rules)
        run: python -I tests/test_pe.py .

      - name: WinPE disk reader (no PowerShell) must match the PowerShell disk list
        run: >
          python -c "from core import winops,pe_disks;
          a=sorted(winops.list_disks(0),key=lambda x:x['Number']);b=pe_disks.list_disks();
          L=lambda x:sorted(str(v.get('Letter') or '').strip(chr(0)) for v in (x.get('Volumes') or []) if str(v.get('Letter') or '').strip(chr(0)));
          print('PS',[(x['Number'],x['Size'],x['FriendlyName'],L(x)) for x in a]);
          [print('PE',x['Number'],x['Size'],x['PartitionStyle'],repr(x['DiskId']),x['BusType'],x['FriendlyName'],'win=',x['HasWindows'],x['WindowsWhy'],L(x)) for x in b];
          assert [(x['Number'],x['Size']) for x in a]==[(x['Number'],x['Size']) for x in b], 'numbers/sizes differ';
          assert [L(x) for x in a]==[L(x) for x in b], 'drive letters differ'"

      - name: Safety test in WinPE mode - Windows disk and tool disk must be refused
        env:
          DISKTOOL_FORCE_PE: "1"
        run: >
          python -c "import os;from core import winops,guard,pe;assert pe.is_pe();
          d=winops.list_disks(0);w=[x for x in d if any(str(v.get('Letter'))=='C' for v in x['Volumes'])];
          assert w and w[0]['HasWindows'], 'Windows disk not detected';r=guard.arm('disk',w[0]['Number'],str(w[0]['Number']));print('ARM C disk:',r);assert not r['ok'];
          a=os.getcwd()[0].upper();t=[x for x in d if any(str(v.get('Letter'))==a for v in x['Volumes'])];
          r=guard.arm('disk',t[0]['Number'],str(t[0]['Number']));print('ARM tool disk:',r);assert not r['ok'];
          assert not guard.arm('volume','C','C')['ok'] and not guard.arm('volume',a,a)['ok']"

      - name: WinPE install test - apply an image to a virtual disk (guard + diskpart + DISM + bcdboot)
        shell: pwsh
        env:
          DISKTOOL_FORCE_PE: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            New-Item -ItemType Directory -Force img\Windows\System32\config | Out-Null
            Copy-Item C:\Windows\Boot img\Windows\Boot -Recurse -ErrorAction SilentlyContinue
            Copy-Item C:\Windows\System32\config\BCD-Template img\Windows\System32\config\
            New-Item -ItemType Directory -Force img\Windows\System32\en-US | Out-Null
            Copy-Item C:\Windows\System32\bootstr.dll img\Windows\System32\
            Copy-Item C:\Windows\System32\en-US\bootstr.dll.mui img\Windows\System32\en-US\
            $o = & bin\wimlib\wimlib-imagex.exe capture img test.wim "Test Windows" 2>&1
            if ($LASTEXITCODE -ne 0) { throw "wim capture failed: $o" }
            "create vdisk file=`"$pwd\t.vhdx`" maximum=4096 type=expandable`nattach vdisk`nexit" | Out-File -Encoding ascii dp.txt
            $o = diskpart /s dp.txt
            if ($LASTEXITCODE -ne 0) { throw "diskpart vdisk failed: $o" }
          } catch { Write-Host "::error title=WinPE install prep::$_"; exit 1 }
          python tests/ci_pe_install.py test.wim
          if ($LASTEXITCODE -ne 0) { throw "WinPE install test failed" }
          "select vdisk file=`"$pwd\t.vhdx`"`ndetach vdisk`nexit" | Out-File -Encoding ascii dp2.txt
          diskpart /s dp2.txt

      - name: Safety test on real Windows - the Windows disk must be refused
        run: >
          python -c "from core import winops,guard;d=winops.list_disks(0);
          s=[x for x in d if x.get('IsSystem') or x.get('IsBoot')];print('SYSTEM DISK',[(x['Number'],x.get('FriendlyName'),x.get('Serial')) for x in s]);
          assert s, 'system disk not detected';r=guard.arm('disk',s[0]['Number'],str(s[0]['Number']));print('ARM C:',r);
          assert not r['ok'], 'GUARD FAILED: Windows disk was allowed';r=guard.arm('volume','C','C');print('ARM VOL C:',r);assert not r['ok']"

      - name: Check bundled YUMI exFAT (official SHA-256)
        shell: pwsh
        run: |
          $h = (Get-FileHash bin\yumi\YUMI-exFAT-1.0.4.3.exe -Algorithm SHA256).Hash.ToLower()
          if ($h -ne "c05319c4ff4f33d7284f105ffb8a716957ee277f01df186ed11949a9c30c345b") { throw "YUMI hash mismatch: $h" }
          python -c "from core import yumi; i=yumi.info(); print('YUMI', i); assert i['verified']"

      - name: Smoke test on real Windows (disks, license, battery, startup)
        run: >
          python -c "import time;from core import winops,sysinfo,startup,health,deploy,settings,capture,guard;
          t=time.time();d=winops.list_disks();print('DISKS',round(time.time()-t,1),'s',d);
          assert d, 'no disks read';
          print('LICENSE',sysinfo.license_info());print('BATTERY',sysinfo.battery());
          print('STARTUP',len(startup.list_items()));print('SMART',health.smart_details());
          print('MEMTEST',winops.memtest_results());print('SYSPREP',deploy._sysprep_exe());print('LETTERS',deploy._free_letters(2));print('SAVEIMG',callable(winops.save_image));print('WINRE',capture._winre_path(print));print('SDI',capture._boot_sdi());print('UEFI',capture._is_uefi());print('BITLOCKER',capture._bitlocker_on());print('SYSPREPDIR',capture._sysprep_dir())"

      - name: Speed test - shared PowerShell vs new PowerShell each time
        run: >
          python -c "import time,subprocess;from core import system,winops;
          t=time.time();[subprocess.run(system.PS+['Get-Date'],capture_output=True) for _ in range(5)];print('5 x new powershell',round(time.time()-t,2),'s');
          system.warm_up();t=time.time();[system.ps_text('Get-Date') for _ in range(5)];print('5 x shared powershell',round(time.time()-t,2),'s');
          t=time.time();d=winops.list_disks(0);print('disk list',round(time.time()-t,2),'s');
          [print(x['Number'],x['FriendlyName'],x['Bus'],'ext=',x['IsExternal'],'unalloc=',x['Unallocated'],'vols=',len(x['Volumes'] or [])) for x in d];
          assert d and 'Bus' in d[0] and 'Volumes' in d[0]"

      - name: Build exe - fast folder version
        run: >
          python -m PyInstaller --noconfirm --clean --onedir --windowed --uac-admin
          --name DiskTool --icon DiskTool.ico
          --add-data "web;web" --add-data "redist;redist"
          --distpath dist_folder --workpath build_folder
          app.py

      - name: Build exe - single exe version
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed --uac-admin
          --name DiskTool --icon DiskTool.ico
          --add-data "web;web" --add-data "redist;redist"
          --distpath dist_single --workpath build_single
          app.py

      - name: Make the two release zips
        shell: pwsh
        run: |
          # 1) Fast folder: DiskTool.exe + _internal + bin  (opens fastest)
          New-Item -ItemType Directory -Force release\DiskTool | Out-Null
          Copy-Item dist_folder\DiskTool\* release\DiskTool\ -Recurse
          Copy-Item bin release\DiskTool\bin -Recurse
          Compress-Archive -Path release\DiskTool -DestinationPath DiskTool.zip -Force
          # 2) Single exe: one DiskTool.exe + bin  (unpacks itself on every start)
          New-Item -ItemType Directory -Force release_single\DiskTool | Out-Null
          Copy-Item dist_single\DiskTool.exe release_single\DiskTool\
          Copy-Item bin release_single\DiskTool\bin -Recurse
          Compress-Archive -Path release_single\DiskTool -DestinationPath DiskTool-SingleExe.zip -Force
          Get-Item DiskTool.zip, DiskTool-SingleExe.zip | Format-Table Name, Length

      - uses: actions/upload-artifact@v5
        with:
          name: DiskTool
          path: release/DiskTool

      - name: Publish a test build for this branch (pre-release "winpe-test")
        if: github.ref != 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete winpe-test --yes --cleanup-tag
          if ($LASTEXITCODE -ne 0) { Write-Host "No old test release." }
          gh release create winpe-test DiskTool.zip DiskTool-SingleExe.zip --prerelease --target $env:GITHUB_SHA --title "Disk Tool - WinPE test build ($env:GITHUB_REF_NAME)" --notes "Test build from branch $env:GITHUB_REF_NAME - not the official release."

      - name: Publish as the "latest" release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag
          if ($LASTEXITCODE -ne 0) { Write-Host "No old release - first build." }
          gh release create latest DiskTool.zip DiskTool-SingleExe.zip --title "Disk Tool (latest build)" --notes "Two versions - pick one, extract it, double-click DiskTool.exe inside the DiskTool folder:`n`n- DiskTool.zip - fast folder version (opens fastest, recommended)`n- DiskTool-SingleExe.zip - one DiskTool.exe + bin folder (unpacks itself every start, a little slower)"

  build-winpe:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cache the ADK + WinPE add-on installers
        uses: actions/cache@v4
        id: adk-cache
        with:
          path: C:\adk_installers
          key: adk-installers-v1-2289980-2289981

      - name: Download the ADK + WinPE add-on (official Microsoft links)
        if: steps.adk-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\adk_installers | Out-Null
          Invoke-WebRequest "https://go.microsoft.com/fwlink/?linkid=2289980" -OutFile C:\adk_installers\adksetup.exe
          Invoke-WebRequest "https://go.microsoft.com/fwlink/?linkid=2289981" -OutFile C:\adk_installers\adkwinpesetup.exe

      - name: Install ADK (Deployment Tools) + WinPE add-on - silent
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 0 = ok, 3010 = reboot needed (fine here), 1001 = this feature is already installed.
          # No /installpath: the runner image already has a "Windows Kits\10" root registered
          # (from the Windows SDK), and the ADK bootstrapper refuses a different path for it.
          function Install-Adk($exe, $features, $label) {
            $log = "$env:RUNNER_TEMP\$label.log"
            $p = Start-Process $exe -ArgumentList "/quiet","/features",$features,"/log",$log -Wait -PassThru
            Write-Host "$label installer exit code: $($p.ExitCode)"
            if (Test-Path $log) {
              Write-Host "---- $log (tail) ----"
              Get-Content $log -Tail 60 | ForEach-Object { Write-Host $_ }
            } else {
              Write-Host "(no log file at $log)"
            }
            if ($p.ExitCode -notin 0, 3010, 1001) {
              throw "$label install failed (exit $($p.ExitCode))"
            }
          }
          Write-Host "---- Deployment Tools / WinPE already registered? ----"
          Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows Kits\Installed Roots' -ErrorAction SilentlyContinue |
            Format-List * | Out-String | Write-Host
          Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall','HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue |
            Get-ItemProperty -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -match 'ADK|Deployment|Preinstallation' } |
            Select-Object DisplayName, DisplayVersion, InstallLocation | Format-Table | Out-String | Write-Host
          Install-Adk C:\adk_installers\adksetup.exe 'OptionId.DeploymentTools' 'ADK'
          Install-Adk C:\adk_installers\adkwinpesetup.exe 'OptionId.WindowsPreinstallationEnvironment' 'WinPE-addon'
          Write-Host "---- Drives ----"
          Get-PSDrive -PSProvider FileSystem | Format-Table | Out-String | Write-Host
          $found = Get-ChildItem 'C:\','D:\' -Filter copype.cmd -Recurse -ErrorAction SilentlyContinue -Depth 6
          if (-not $found) {
            Write-Host "::error::copype.cmd not found anywhere under C:\ or D:\"
            throw "WinPE add-on did not install where expected"
          }
          $found | ForEach-Object { Write-Host "Found: $($_.FullName)" }
          # copype.cmd is at <AdkRoot>\Assessment and Deployment Kit\Windows Preinstallation Environment\copype.cmd
          $adkRoot = $found[0].FullName -replace '\\Assessment and Deployment Kit\\.*$', ''
          Write-Host "ADK root: $adkRoot"
          "ADK_ROOT=$adkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: On failure - publish the ADK install logs so they can be read without CI access
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path "$env:RUNNER_TEMP\ADK.log","$env:RUNNER_TEMP\WinPE-addon.log" -DestinationPath adk-logs.zip -ErrorAction SilentlyContinue
          if (-not (Test-Path adk-logs.zip)) { "no log files were created" | Out-File adk-logs.zip }
          gh release delete ci-debug --yes --cleanup-tag 2>$null
          gh release create ci-debug adk-logs.zip --prerelease --target $env:GITHUB_SHA --title "CI debug logs" --notes "temporary - ADK install debug"

      - name: Build the custom WinPE ISO (PowerShell, storage, networking)
        shell: pwsh
        run: .\tools\build_winpe.ps1 -AdkRoot "$env:ADK_ROOT" -OutIso '.\WinPE_amd64.iso'

      - name: Smoke test - mount the ISO and check the optional components landed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $img = Mount-DiskImage -ImagePath (Resolve-Path .\WinPE_amd64.iso) -PassThru
          $drive = ($img | Get-Volume).DriveLetter
          try {
            $boot = "$($drive):\sources\boot.wim"
            if (-not (Test-Path $boot)) { throw "boot.wim not found on the ISO" }
            $mnt = "C:\wpe_check"
            New-Item -ItemType Directory -Force $mnt | Out-Null
            Dism /Mount-Image /ImageFile:$boot /index:1 /MountDir:$mnt /ReadOnly
            try {
              foreach ($exe in @('Windows\System32\WindowsPowerShell\v1.0\powershell.exe',
                                  'Windows\System32\wbem\wmic.exe',
                                  'Windows\System32\diskpart.exe')) {
                $p = Join-Path $mnt $exe
                if (-not (Test-Path $p)) { throw "Missing from the WinPE image: $exe" }
                Write-Host "[OK] $exe"
              }
              $startnet = Get-Content (Join-Path $mnt 'Windows\System32\startnet.cmd') -Raw
              if ($startnet -notmatch 'wpeinit') { throw "startnet.cmd does not call wpeinit" }
              Write-Host "[OK] startnet.cmd runs wpeinit"
            } finally {
              Dism /Unmount-Image /MountDir:$mnt /discard
            }
          } finally {
            Dismount-DiskImage -ImagePath (Resolve-Path .\WinPE_amd64.iso) | Out-Null
          }

      - uses: actions/upload-artifact@v5
        with:
          name: WinPE_amd64
          path: WinPE_amd64.iso

      - name: Publish the WinPE ISO on the same release as the DiskTool build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ($env:GITHUB_REF -eq 'refs/heads/main') { 'latest' } else { 'winpe-test' }
          gh release upload $tag .\WinPE_amd64.iso --clobber
