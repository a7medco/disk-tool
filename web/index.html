  /* ===== Theme: NVIDIA-installer style (dark default, light optional) ===== */
  :root{
    --g:#76b900; --g-hi:#8fd400; --g-ink:#0b0f02;
    --bg1:#16181b; --bg2:#2a2d33; --panel:#1f2226; --panel-2:#272a30; --line:#363a41;
    --ink:#eef0f2; --muted:#9aa1aa; --navi:#c9cdd3; --nav-act:#2f333a;
    --ok:#76b900; --good:#76b900; --warn:#f0a020; --bad:#e5484d;
    --console:#0f1113; --console-ink:#d7dbe0; --console-cmd:#9bd14a;
    --field:#15171a; --radius:6px; --shadow:0 1px 0 rgba(255,255,255,.03),0 8px 24px rgba(0,0,0,.35);
    --head-bg:linear-gradient(180deg,#121417,#1a1c20);
  }
  [data-theme="light"]{
    --g:#5f9600; --g-hi:#76b900; --g-ink:#ffffff;
    --bg1:#f3f4f6; --bg2:#e7e9ec; --panel:#ffffff; --panel-2:#f6f7f9; --line:#dde0e4;
    --ink:#1c1f23; --muted:#68707a; --navi:#3a4048; --nav-act:#e3e6ea;
    --console:#1a1d21; --console-ink:#e4e7ea; --console-cmd:#9bd14a;
    --field:#ffffff; --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.06);
    --head-bg:linear-gradient(180deg,#ffffff,#f1f2f4);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{display:flex;flex-direction:column;color:var(--ink);
    background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 100%);
    font-family:"Barlow","Segoe UI",system-ui,sans-serif;font-size:14.5px;overflow:hidden}

  /* top header (like the NVIDIA installer) */
  .top{display:flex;align-items:center;justify-content:space-between;padding:16px 26px 14px;
    background:var(--head-bg);border-bottom:1px solid var(--line);flex-shrink:0}
  .top h1{font-size:19px;font-weight:700;letter-spacing:.2px}
  .top p{font-size:12.5px;color:var(--muted);margin-top:2px}
  .brandmark{display:flex;align-items:center;gap:9px}
  .emblem{width:30px;height:24px;border-radius:5px;background:var(--g);display:flex;
    align-items:center;justify-content:center;color:var(--g-ink);font-weight:900;font-size:15px;
    clip-path:polygon(0 0,100% 0,100% 72%,72% 100%,0 100%)}
  .wordmark{font-weight:900;font-size:22px;letter-spacing:1.5px;color:var(--ink);font-family:"Barlow","Segoe UI",sans-serif}
  .themebtn{margin-left:18px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);
    border-radius:20px;padding:5px 12px;font:inherit;font-size:12px;cursor:pointer}
  .themebtn:hover{border-color:var(--g)}

  .shell{flex:1;display:flex;min-height:0}
  /* left steps column */
  .side{width:236px;flex-shrink:0;display:flex;flex-direction:column;padding:14px 12px 12px;
    border-right:1px solid var(--line)}
  .nav{display:flex;flex-direction:column;gap:1px;flex:1 1 auto;overflow-y:auto;min-height:0}
  .nav::-webkit-scrollbar{width:6px}.nav::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  .nav .grp{font-size:10.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
    color:var(--g);padding:14px 12px 5px}
  .nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;cursor:pointer;
    background:transparent;color:var(--navi);font:inherit;font-size:14px;text-align:left;
    padding:8px 12px;border-radius:4px;transition:.12s;border-left:3px solid transparent}
  .nav button .ic{width:16px;text-align:center;color:var(--muted)}
  .nav button:hover{background:var(--nav-act);color:var(--ink)}
  .nav button.active{background:var(--nav-act);color:var(--ink);font-weight:700;border-left-color:var(--g)}
  .nav button.active .ic{color:var(--g)}
  .nav button.active::after{content:"➔";margin-left:auto;color:var(--g);font-size:12px}
  .dedic{margin-top:10px;padding:12px 8px 6px;border-top:1px solid var(--line);text-align:center;flex-shrink:0}
  .dedic-k{font-family:"DedTitle","Segoe UI",sans-serif;font-weight:800;color:var(--g);font-size:15px;margin-bottom:5px}
  .dedic-n{font-family:"DedNaskh","Segoe UI",serif;font-weight:600;color:var(--ink);font-size:17.5px;line-height:1.7;white-space:nowrap}
  .dedic-s,.dedic-d{font-family:"DedNaskh","Segoe UI",serif;font-weight:600;color:var(--muted);font-size:14px;line-height:1.6}
  .side .foot{font-size:10.5px;color:var(--muted);padding:6px 10px 0;text-align:center}

  /* main */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .head{padding:20px 28px 8px}
  .head h2{font-size:23px;font-weight:700}
  .head p{color:var(--muted);font-size:13.5px;margin-top:4px}
  .content{flex:1;overflow:auto;padding:12px 28px 18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

  .btn{border:0;cursor:pointer;font:inherit;font-weight:600;font-size:13.5px;letter-spacing:1.2px;
    text-transform:uppercase;border-radius:3px;padding:10px 20px;background:var(--g);color:var(--g-ink);transition:.12s}
  .btn:hover{background:var(--g-hi)}
  .btn.ghost{background:var(--panel-2);color:var(--ink);border:1px solid var(--line)}
  .btn.ghost:hover{border-color:var(--muted);background:var(--nav-act)}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.stop{background:var(--bad);color:#fff}
  .btn.small{padding:6px 12px;font-size:11.5px}

  table{width:100%;border-collapse:collapse}
  thead th{text-align:left;font-size:13px;font-weight:600;color:var(--ink);padding:12px 16px;border-bottom:1px solid var(--line)}
  tbody td{padding:12px 16px;border-bottom:1px solid var(--line);font-size:13.5px}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--panel-2)}
  .model{font-weight:600}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:3px}
  .badge::before{content:"";width:8px;height:8px;border-radius:50%}
  .b-ok{background:rgba(118,185,0,.14);color:var(--ok)} .b-ok::before{background:var(--ok)}
  .b-warn{background:rgba(240,160,32,.14);color:var(--warn)} .b-warn::before{background:var(--warn)}
  .b-bad{background:rgba(229,72,77,.14);color:var(--bad)} .b-bad::before{background:var(--bad)}
  .tag{font-size:11px;font-weight:700;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);padding:2px 8px;border-radius:3px}

  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:15px;max-width:460px}
  .field label{font-size:12.5px;font-weight:600;color:var(--muted)}
  .field input,.field select{font:inherit;font-size:13.5px;padding:9px 11px;border:1px solid var(--line);
    border-radius:3px;background:var(--field);color:var(--ink);outline:none}
  .field input:focus,.field select:focus{border-color:var(--g)}
  .pathrow{display:flex;gap:8px}.pathrow input{flex:1}
  .radio{display:flex;flex-direction:column;gap:9px;margin:4px 0 16px}
  .radio label,.switch{display:flex;align-items:center;gap:9px;font-size:13.5px;cursor:pointer}
  input[type=radio],input[type=checkbox]{accent-color:var(--g)}
  .warnbox{background:rgba(240,160,32,.10);border:1px solid rgba(240,160,32,.45);color:var(--ink);
    border-radius:4px;padding:11px 14px;font-size:13px;margin-bottom:16px;max-width:640px}
  .sectionhint{color:var(--muted);font-size:12.5px;margin:-2px 0 14px}
  .mono{font-family:Consolas,monospace;font-size:12px;color:var(--muted);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .box{padding:18px 20px}
  .box h3{font-size:15px;font-weight:700;margin-bottom:10px}
  .empty{color:var(--muted);font-size:13px;padding:22px 4px}

  .console-wrap{padding:0 28px 18px}
  .console-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .console-h span{font-size:11.5px;font-weight:700;color:var(--g);text-transform:uppercase;letter-spacing:1.2px}
  .console-h .clear{font-size:12px;color:var(--muted);cursor:pointer;background:0;border:0}
  .console{height:140px;overflow:auto;background:var(--console);color:var(--console-ink);border:1px solid var(--line);
    border-radius:4px;padding:12px 14px;font-family:Consolas,monospace;font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
  .console .cmd{color:var(--console-cmd)} .console .ok{color:#8fd400} .console .bad{color:#ff7b7f}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid #0004;border-top-color:currentColor;
    border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px;margin-right:7px}
  @keyframes s{to{transform:rotate(360deg)}}
  /* small screens (e.g. 1366x768 laptops): tighter layout */
  @media (max-height:720px),(max-width:1100px){
    .top{padding:10px 20px 9px}.top h1{font-size:17px}.wordmark{font-size:19px}

  }

<body>
  <header class="top">
    <div><h1>Disk Tool</h1><p>Windows service toolkit · Version <span id="ver">2.6</span></p></div>
    <div class="brandmark">
      <div class="emblem">A</div><div class="wordmark">ABUZAID</div>
      <button class="themebtn" id="themebtn" onclick="toggleTheme()">☀ Light</button>
    </div>
  </header>
  <div class="shell">
  <aside class="side">
    <nav class="nav" id="nav"></nav>
    <div class="dedic" dir="rtl">
      <div class="dedic-k">صدقة جارية</div>
      <div class="dedic-s">على روح</div>
      <div class="dedic-n">زينب عبد العليم مصطفى</div>
      <div class="dedic-d">رحمها الله</div>
    </div>
    <div class="foot">Abuzaid · Maadi, Cairo</div>
  </aside>

  <main class="main">
    <div class="head"><h2 id="title">Disks &amp; health</h2><p id="sub"></p></div>
    <div class="content" id="content"></div>
    <div class="console-wrap">
      <div class="console-h"><span>Output</span><button class="clear" onclick="clearLog()">clear</button></div>
      <div class="console" id="console"><div class="empty">Output from commands shows here.</div></div>
    </div>
  </main>
  </div>
<script>
const FS=["NTFS","exFAT","FAT32"], SCHEMES=["GPT","MBR"];
const VIEWS=[
  {grp:"Drives"},
  {id:"disks",   name:"Disks & health",     ic:"◇", fn:viewDisks},
  {id:"format",  name:"Format a drive",     ic:"▱", fn:viewFormat},
  {id:"part",    name:"Partition tools",    ic:"▤", fn:viewPart},
  {id:"repair",  name:"HDD repair",         ic:"✚", fn:viewRepair},
  {id:"copy",    name:"Fast copy",          ic:"⇄", fn:viewCopy},
  {grp:"Bootable"},
  {id:"usb",     name:"Windows USB",        ic:"▸", fn:viewUSB},
  {id:"multi",   name:"Multi-ISO USB",      ic:"❖", fn:viewMulti},
  {id:"img",     name:"IMG write / save",   ic:"◈", fn:viewImg},
  {id:"wtg",     name:"Windows To Go",      ic:"⇪", fn:viewWtg},
  {id:"inst",    name:"Install to disk",    ic:"⤓", fn:viewInst},
  {grp:"Windows"},
  {id:"oobe",    name:"Reset to OOBE", ic:"↺", fn:viewOobe},
  {id:"ram",     name:"Memory test",        ic:"▦", fn:viewRam},
  {id:"battery", name:"Battery health",     ic:"▮", fn:viewBattery},
  {id:"license", name:"Windows license",    ic:"⚿", fn:viewLicense},
  {id:"startup", name:"Startup apps",       ic:"⏻", fn:viewStartup},
  {id:"drivers", name:"Drivers backup",     ic:"❏", fn:viewDrivers},
  {id:"locks",   name:"Device locks",       ic:"⬚", fn:viewLocks},
  {id:"pass",    name:"Reset password",     ic:"✳", fn:viewPass},
  {id:"enc",     name:"Encrypt (VeraCrypt)",ic:"⬢", fn:viewEncrypt},
  {id:"menu",    name:"Right-click menu",   ic:"☰", fn:viewMenu},
];
let PREVIEW = true;   // becomes false once pywebview is ready
let busy=false;
const api=()=>window.pywebview.api;

function nav(){
  const n=document.getElementById("nav");
  VIEWS.forEach(v=>{
    if(v.grp){const g=document.createElement("div");g.className="grp";g.textContent=v.grp;n.appendChild(g);return;}
    const b=document.createElement("button");
    b.innerHTML=`<span class="ic">${v.ic}</span>${v.name}`;
    b.onclick=()=>{if(busy){appendLog("[!] Wait for the current job to finish (or press Stop).");return;}active(b);v.fn();};
    b.dataset.id=v.id; n.appendChild(b);
  });
}
function go(id){const v=VIEWS.find(x=>x.id===id)||VIEWS[1];
  const b=document.querySelector(`.nav button[data-id="${v.id}"]`);active(b);b.scrollIntoView({block:"nearest"});v.fn();}
function active(b){document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");}
function content(){return document.getElementById("content");}
function setTitle(t,s){document.getElementById("title").textContent=t;document.getElementById("sub").textContent=s||"";}
function setBusy(b){busy=b;document.querySelectorAll(".btn:not(.keep)").forEach(x=>x.disabled=b);
  document.querySelectorAll(".btn.stop").forEach(x=>x.disabled=!b);}
function stopJob(){if(!PREVIEW)api().stop();appendLog("Stopping...");}

/* ---- console ---- */
function appendLog(line){
  const c=document.getElementById("console");
  if(c.querySelector(".empty"))c.innerHTML="";
  const d=document.createElement("div");
  if(line.startsWith(">")||line.startsWith("    "))d.className="cmd";
  else if(line.startsWith("[OK]"))d.className="ok";
  else if(line.startsWith("[X]"))d.className="bad";
  d.textContent=line; c.appendChild(d); c.scrollTop=c.scrollHeight;
}
function clearLog(){document.getElementById("console").innerHTML='<div class="empty">Output from commands shows here.</div>';}
window.onLog=appendLog;
window.onDone=function(code){setBusy(false);};

/* ---- data ---- */
async function getDisks(fresh){
  if(PREVIEW)return [
    {Number:0,FriendlyName:"Samsung SSD 970 EVO Plus",Size:500107862016,BusType:"NVMe",PartitionStyle:"GPT",IsBoot:true,IsSystem:true,HealthStatus:"Healthy"},
    {Number:1,FriendlyName:"WD Elements 25A3",Size:1000204886016,BusType:"USB",PartitionStyle:"MBR",IsBoot:false,HealthStatus:"Warning"},
    {Number:2,FriendlyName:"SanDisk Ultra Flash",Size:32010928128,BusType:"USB",PartitionStyle:"MBR",IsBoot:false,HealthStatus:"Healthy"},
  ];
  try{const r=await api().list_disks(!!fresh);
    if(fresh||r.took>5)appendLog("Disks read in "+r.took+" s"+(r.rows.length?"":" — none found"));
    return r.rows;}
  catch(e){appendLog("[X] Could not read the disks: "+(e.message||e));return [];}
}
const GB=b=>(b/1e9).toFixed(b<1e11?1:0)+" GB";
function badge(h){const m={Healthy:["b-ok",h],Warning:["b-warn",h+" · back up"],Unhealthy:["b-bad",h+" · replace"]};
  const[k,t]=m[h]||["tag",h];return `<span class="badge ${k}">${t}</span>`;}

/* ---- views ---- */
async function viewDisks(fresh){
  setTitle("Disks & health","Every drive connected to this PC, with its SMART health.");
  content().innerHTML=`<div class="row" style="margin-bottom:14px">
    <button class="btn" onclick="viewDisks(true)">Refresh</button></div>
    <div class="card"><table><thead><tr>
    <th>#</th><th>Model</th><th>Size</th><th>Bus</th><th>Role</th><th>Health</th></tr></thead>
    <tbody id="dt"><tr><td colspan="6" class="empty">Reading drives…</td></tr></tbody></table></div>`;
  const rows=await getDisks(fresh===true);
  if(!rows.length){document.getElementById("dt").innerHTML='<tr><td colspan="6" class="empty">No disks were read. Press Refresh, or see the output below.</td></tr>';return;}
  document.getElementById("dt").innerHTML=rows.map(d=>`<tr>
    <td>${d.Number}</td><td class="model">${d.FriendlyName||"?"}</td><td>${GB(d.Size||0)}</td>
    <td>${d.BusType||"?"}</td><td>${(d.IsBoot||d.IsSystem)?'<span class="tag">BOOT</span>':"data"}</td>
    <td>${badge(d.HealthStatus||"Unknown")}</td></tr>`).join("");
}

async function viewFormat(){
  setTitle("Format a drive","Erase a USB disk and set up a fresh filesystem.");
  const rows=(await getDisks()).filter(d=>d.BusType==="USB"&&!(d.IsBoot||d.IsSystem));
  const opts=rows.map((d,i)=>`<option value="${i}">Disk ${d.Number} — ${d.FriendlyName} (${GB(d.Size||0)})</option>`).join("");
  content().innerHTML=`
    <div class="warnbox">⚠ Only external USB disks are listed. The Windows drive can't be selected here.</div>
    <div class="field"><label>Disk</label><select id="f-disk">${opts||'<option>No USB disk connected</option>'}</select></div>
    <div class="field"><label>Filesystem</label><select id="f-fs">${FS.map(x=>`<option>${x}</option>`).join("")}</select></div>
    <div class="field"><label>Partition scheme</label><select id="f-sch">${SCHEMES.map(x=>`<option>${x}</option>`).join("")}</select></div>
    <div class="field"><label>Label</label><input id="f-label" value="USB" maxlength="32"></div>
    <button class="btn" onclick="doFormat()">Format drive</button>`;
  window._fmt=rows;
}
async function doFormat(){
  const rows=window._fmt||[];const i=+document.getElementById("f-disk").value;
  if(!rows[i]){alert("Connect and pick a USB disk first.");return;}
  const d=rows[i],fs=document.getElementById("f-fs").value,sch=document.getElementById("f-sch").value,
    label=document.getElementById("f-label").value||"USB";
  if(fs==="FAT32"&&d.Size>32e9){alert("FAT32 is limited to 32 GB. Use exFAT or NTFS.");return;}
  const t=prompt(`ALL DATA on Disk ${d.Number} (${d.FriendlyName}) will be destroyed.\nType ${d.Number} to confirm:`);
  if(t===null||t.trim()!==String(d.Number)){appendLog("Cancelled.");return;}
  setBusy(true);
  if(PREVIEW){appendLog("> diskpart /s (preview only)");setBusy(false);return;}
  window.pywebview.api.format_disk(d.Number,fs,sch,label);
}

function viewCopy(){
  setTitle("Fast copy","Resumable copy with robocopy — continues if interrupted.");
  content().innerHTML=`
    <div class="field"><label>From (source folder)</label>
      <div class="pathrow"><input id="c-src"><button class="btn ghost" onclick="pick('c-src')">Browse</button></div></div>
    <div class="field"><label>To (destination folder)</label>
      <div class="pathrow"><input id="c-dst"><button class="btn ghost" onclick="pick('c-dst')">Browse</button></div></div>
    <button class="btn" onclick="doCopy()">Start copy</button>`;
}
async function pick(id){if(PREVIEW)return;const p=await window.pywebview.api.choose_folder();if(p)document.getElementById(id).value=p;}
function doCopy(){
  const src=document.getElementById("c-src").value,dst=document.getElementById("c-dst").value;
  if(!src||!dst){alert("Choose a source and a destination folder.");return;}
  setBusy(true);
  if(PREVIEW){appendLog("> robocopy (preview)");setBusy(false);return;}
  window.pywebview.api.robocopy(src,dst);
}

/* ---- Bootable USB ---- */
async function viewUSB(){
  setTitle("Bootable Windows USB","Make a UEFI Windows installer from an ISO.");
  const rows=(await getDisks()).filter(d=>d.BusType==="USB"&&!(d.IsBoot||d.IsSystem));
  const opts=rows.map((d,i)=>`<option value="${i}">Disk ${d.Number} — ${d.FriendlyName} (${GB(d.Size||0)})</option>`).join("");
  content().innerHTML=`
    <div class="warnbox">⚠ The whole USB disk is erased. FAT32 + UEFI; install.wim is split automatically if large.</div>
    <div class="field"><label>Windows ISO</label>
      <div class="pathrow"><input id="u-iso"><button class="btn ghost" onclick="pickFile('u-iso')">Browse</button></div></div>
    <div class="field"><label>USB disk</label><select id="u-disk">${opts||'<option>No USB disk connected</option>'}</select></div>
    <div class="field"><label>Drive letter to use</label><input id="u-letter" value="W" maxlength="1" style="max-width:90px"></div>
    <button class="btn" onclick="doUSB()">Create bootable USB</button>`;
  window._usb=rows;
}
function doUSB(){
  const rows=window._usb||[],i=+document.getElementById("u-disk").value,iso=document.getElementById("u-iso").value;
  if(!rows[i]){alert("Pick a USB disk.");return;}
  if(!iso){alert("Choose a Windows ISO file.");return;}
  const L=(document.getElementById("u-letter").value||"W").slice(0,1).toUpperCase();
  const t=prompt(`ALL DATA on Disk ${rows[i].Number} will be erased.\nType ${rows[i].Number} to confirm:`);
  if(t===null||t.trim()!==String(rows[i].Number)){appendLog("Cancelled.");return;}
  setBusy(true);
  if(PREVIEW){appendLog("> diskpart + robocopy + dism (preview)");setBusy(false);return;}
  window.pywebview.api.bootable_usb(iso,rows[i].Number,L);
}

/* ---- Device locks ---- */
async function viewLocks(){
  setTitle("Device locks","Is this PC clean or managed? Read-only — nothing is changed.");
  content().innerHTML=`<div class="card"><table><thead><tr>
    <th>Check</th><th>Status</th><th>Meaning</th></tr></thead>
    <tbody id="lk"><tr><td colspan="3" class="empty">Reading…</td></tr></tbody></table></div>`;
  let items;
  if(PREVIEW) items=[
    {label:"BitLocker",value:"Off",sev:"ok",note:""},
    {label:"Organisation (Azure AD / Intune)",value:"Managed",sev:"bad",note:"A company/school controls this PC via MDM."},
    {label:"Secure Boot",value:"On",sev:"info",note:""},
    {label:"Windows activation",value:"The machine is permanently activated.",sev:"info",note:""}];
  else items=await window.pywebview.api.device_locks();
  const cls={ok:"b-ok",warn:"b-warn",bad:"b-bad",info:"tag"};
  document.getElementById("lk").innerHTML=items.map(it=>`<tr>
    <td class="model">${it.label}</td>
    <td>${it.sev==="info"?`<span class="tag">${it.value}</span>`:`<span class="badge ${cls[it.sev]}">${it.value}</span>`}</td>
    <td style="color:var(--muted)">${it.note||"—"}</td></tr>`).join("");
}

/* ---- Reset password ---- */
async function viewPass(){
  setTitle("Reset a local password","For a LOCAL Windows account on this PC.");
  let users=PREVIEW?["Administrator","ahmed","client"]:await window.pywebview.api.list_local_users();
  content().innerHTML=`
    <div class="warnbox">Works for a local account whose owner is present. It does NOT bypass a Microsoft-account login, a company domain, or BitLocker.</div>
    <div class="field"><label>Local account</label><select id="p-user">${users.map(u=>`<option>${u}</option>`).join("")}</select></div>
    <div class="field"><label>New password</label><input id="p-pw" type="password"></div>
    <div class="row">
      <button class="btn" onclick="doPass('reset')">Set password</button>
      <button class="btn ghost" onclick="doPass('admin')">Create new admin account</button></div>
    <p class="sectionhint" style="margin-top:14px">“Create new admin” adds a brand-new local administrator with the name &amp; password above.</p>`;
}
function doPass(mode){
  const user=document.getElementById("p-user").value, pw=document.getElementById("p-pw").value;
  if(!user||!pw){alert("Pick an account and type a new password.");return;}
  setBusy(true);
  if(PREVIEW){appendLog(`> net user ${user} ***`);setBusy(false);return;}
  if(mode==="admin") window.pywebview.api.create_admin(user,pw);
  else window.pywebview.api.reset_password(user,pw);
}

/* ---- Encrypt (VeraCrypt) ---- */
function viewEncrypt(){
  setTitle("Encrypt (VeraCrypt)","A password-protected container that opens on Windows and Mac.");
  content().innerHTML=`
    <div class="sectionhint">Needs VeraCrypt installed. The container is one file; it opens like a separate drive.</div>
    <div class="field"><label>Container file (e.g. D:\\secret.hc)</label><input id="v-path" value="D:\\secret.hc"></div>
    <div class="row" style="gap:18px;margin-bottom:12px">
      <div class="field" style="margin:0"><label>Size</label><input id="v-size" value="5G" style="max-width:120px"></div>
      <div class="field" style="margin:0"><label>Filesystem</label><select id="v-fs"><option>exFAT</option><option>NTFS</option><option>FAT</option></select></div>
    </div>
    <div class="field"><label>Password</label><input id="v-pw" type="password"></div>
    <div class="row">
      <button class="btn" onclick="doVC('create')">Create container</button>
      <button class="btn ghost" onclick="doVC('mount')">Open (needs letter)</button>
      <button class="btn ghost" onclick="doVC('dismount')">Close all</button></div>
    <div class="field" style="margin-top:14px;max-width:120px"><label>Open as letter</label><input id="v-letter" value="X" maxlength="1"></div>`;
}
function doVC(mode){
  const path=document.getElementById("v-path").value,pw=document.getElementById("v-pw").value,
    size=document.getElementById("v-size").value,fs=document.getElementById("v-fs").value,
    letter=(document.getElementById("v-letter").value||"X").slice(0,1).toUpperCase();
  setBusy(true);
  if(PREVIEW){appendLog("> VeraCrypt (preview)");setBusy(false);return;}
  if(mode==="create"){ if(!path||!pw){alert("Need a path and password.");setBusy(false);return;} window.pywebview.api.vc_create(path,size,fs,pw);}
  else if(mode==="mount"){ if(!path||!pw){alert("Need a path and password.");setBusy(false);return;} window.pywebview.api.vc_mount(path,letter,pw);}
  else window.pywebview.api.vc_dismount("");
}

/* ---- helpers ---- */
const usbDisks=async()=>(await getDisks()).filter(d=>d.BusType==="USB"&&!(d.IsBoot||d.IsSystem));
const diskOpts=rows=>rows.map((d,i)=>`<option value="${i}">Disk ${d.Number} — ${d.FriendlyName} (${GB(d.Size||0)})</option>`).join("")||'<option value="-1">No USB disk connected</option>';
function confirmDisk(d,what){const t=prompt(`${what}\nALL DATA on Disk ${d.Number} (${d.FriendlyName}) will be destroyed.\nType ${d.Number} to confirm:`);
  if(t===null||t.trim()!==String(d.Number)){appendLog("Cancelled.");return false;}return true;}
function run(fnName,args,pv){setBusy(true);
  if(PREVIEW){appendLog("> "+(pv||fnName)+" (preview)");setTimeout(()=>setBusy(false),300);return;}
  api()[fnName](...args);}
const stopBtn='<button class="btn stop keep" onclick="stopJob()" disabled>Stop</button>';
async function pickDir(id){if(PREVIEW)return;const p=await api().choose_folder();if(p)document.getElementById(id).value=p;}
async function pickAny(id,kind){if(PREVIEW)return;const p=await api().choose_file(kind);if(p)document.getElementById(id).value=p;}

/* ---- HDD repair ---- */
async function viewRepair(){
  setTitle("HDD repair","Health counters, surface scan, chkdsk, and Windows system-file repair.");
  content().innerHTML=`
   <div class="card" style="margin-bottom:16px"><table><thead><tr>
     <th>#</th><th>Model</th><th>Type</th><th>Temp</th><th>Wear</th><th>Hours</th><th>Read / write errors</th><th>Verdict</th></tr></thead>
     <tbody id="sm"><tr><td colspan="8" class="empty">Reading SMART counters…</td></tr></tbody></table></div>
   <div class="grid2">
    <div class="card box"><h3>1 · Surface scan (read-only)</h3>
      <div class="sectionhint">Reads every block of the disk and finds bad or slow areas. Nothing is written. Big disks take hours.</div>
      <div class="field"><label>Disk</label><select id="s-disk"></select></div>
      <div class="row"><button class="btn" onclick="doSurface()">Start scan</button>${stopBtn}</div></div>
    <div class="card box"><h3>2 · File-system repair (chkdsk)</h3>
      <div class="field"><label>Drive letter</label><input id="r-drv" value="D" maxlength="1" style="max-width:90px"></div>
      <div class="radio">
        <label><input type="radio" name="lvl" value="scan" checked> Scan — read-only, safe</label>
        <label><input type="radio" name="lvl" value="fix"> Fix errors (/f)</label>
        <label><input type="radio" name="lvl" value="full"> Fix + bad sectors (/r, slow)</label></div>
      <button class="btn" onclick="doRepair()">Run chkdsk</button></div>
    <div class="card box"><h3>3 · Windows system files</h3>
      <div class="sectionhint">For a Windows that boots but is slow, crashes or has broken parts. Run DISM first, then SFC.</div>
      <div class="row"><button class="btn" onclick="run('system_repair',['dism'],'DISM /RestoreHealth')">DISM RestoreHealth</button>
      <button class="btn ghost" onclick="run('system_repair',['sfc'],'sfc /scannow')">SFC scannow</button></div></div>
   </div>`;
  const all=await getDisks();window._sd=all;
  document.getElementById("s-disk").innerHTML=all.map((d,i)=>`<option value="${i}">Disk ${d.Number} — ${d.FriendlyName} (${GB(d.Size||0)})</option>`).join("");
  let rows;
  if(PREVIEW)rows=[{Id:"0",Name:"Samsung SSD 970 EVO Plus",Media:"SSD",Temp:41,Wear:3,Hours:6120,ReadErr:0,WriteErr:0,Verdict:"ok"},
    {Id:"1",Name:"WDC WD10EZEX",Media:"HDD",Temp:47,Wear:null,Hours:31877,ReadErr:12,WriteErr:0,Verdict:"bad"}];
  else rows=await api().smart_details();
  const v={ok:'<span class="badge b-ok">Good</span>',warn:'<span class="badge b-warn">Watch</span>',bad:'<span class="badge b-bad">Back up now</span>'};
  const n=x=>(x===null||x===undefined||x==="")?'<span style="color:var(--muted)">—</span>':x;
  document.getElementById("sm").innerHTML=rows.map(r=>`<tr><td>${r.Id}</td><td class="model">${r.Name||"?"}</td>
    <td>${r.Media||"?"}</td><td>${r.Temp?r.Temp+"°C":n(null)}</td><td>${(r.Wear!==null&&r.Wear!==undefined&&r.Wear!=="")?r.Wear+"%":n(null)}</td>
    <td>${n(r.Hours)}</td><td>${n(r.ReadErr)} / ${n(r.WriteErr)}</td><td>${v[r.Verdict]||""}</td></tr>`).join("")
    ||'<tr><td colspan="8" class="empty">No counters reported by this PC.</td></tr>';
}
function doSurface(){const d=(window._sd||[])[+document.getElementById("s-disk").value];
  if(!d){alert("Pick a disk.");return;}
  run("surface_test",[d.Number,d.Size],"surface read test Disk "+d.Number);}
function doRepair(){
  const drv=(document.getElementById("r-drv").value||"").replace(":","").slice(0,1).toUpperCase();
  if(!/[A-Z]/.test(drv)){alert("Enter a drive letter, e.g. D.");return;}
  const lvl=document.querySelector('input[name=lvl]:checked').value;
  if(lvl!=="scan"&&drv==="C")appendLog("Note: C: is in use - Windows will ask to run the fix on next restart.");
  run("chkdsk",[drv,lvl],"chkdsk "+drv+":");}

/* ---- Multi-ISO (Ventoy) ---- */
async function viewMulti(){
  setTitle("Multi-ISO USB","One USB, many systems: Windows, Linux, WinPE, tools — pick from a boot menu (Ventoy).");
  const rows=await usbDisks();window._mu=rows;
  const info=PREVIEW?{exe:""}:await api().ventoy_info();
  content().innerHTML=`
   <div class="card box" style="margin-bottom:16px;max-width:760px">
     <div class="row" style="justify-content:space-between">
       <div><b>Ventoy:</b> <span class="mono" id="m-exe">${info.exe||"not found — download from ventoy.net, extract into bin\\ventoy"}</span></div>
       <button class="btn ghost small" onclick="locateVentoy()">Locate…</button></div></div>
   <div class="grid2" style="max-width:980px">
    <div class="card box"><h3>1 · Prepare the USB (once)</h3>
      <div class="field"><label>USB disk</label><select id="m-disk">${diskOpts(rows)}</select></div>
      <label class="switch"><input type="checkbox" id="m-gpt"> GPT (newer PCs only — leave off for old + new PCs)</label>
      <label class="switch"><input type="checkbox" id="m-sb" checked> Secure Boot support</label>

window.addEventListener("pywebviewready",()=>{if(apiReady()){if(started&&PREVIEW)start();else once();}});
(function wait(t){if(apiReady())return once();
  if(t>1500&&!window.pywebview)return once();          // plain browser: preview mode
  setTimeout(()=>wait(t+200),200);})(0);
</script>
